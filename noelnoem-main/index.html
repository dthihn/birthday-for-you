<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Happy Birthday Giang 🎂</title>
    <link rel="icon" href="https://img.icons8.com/color/48/birthday-cake.png" type="image/x-icon">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Times New Roman', serif; }
        #canvas-container {
            width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;
            background: radial-gradient(circle at center, #1a0b12 0%, #000000 70%);
        }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; 
            align-items: center;
            justify-content: space-between; 
            padding: 40px 0 20px 0;
            box-sizing: border-box;
            transition: opacity 0.5s ease;
        }
        
        .ui-hidden { opacity: 0 !important; pointer-events: none !important; }

        /* Loading */
        #loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.5s ease-out;
        }
        .loader-text {
            color: #d4af37; font-size: 18px; letter-spacing: 2px; margin-top: 20px;
            font-family: 'Cinzel', serif; font-weight: 400;
            overflow: hidden; white-space: nowrap;
            border-right: 2px solid #d4af37;
            animation: typing 3s steps(40, end), blink-caret .75s step-end infinite;
        }

        @keyframes typing {
          from { width: 0 }
          to { width: 280px }
        }

        @keyframes blink-caret {
          from, to { border-color: transparent }
          50% { border-color: #d4af37; }
        }

        .spinner {
            width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.2); 
            border-top: 1px solid #d4af37; border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Nút Start */
        #start-btn {
            display: none;
            margin-top: 30px;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 12px 30px;
            font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 2px;
            cursor: pointer; transition: all 0.5s ease;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            animation: pulse-btn 2s infinite;
        }
        #start-btn:hover {
            background: #d4af37; color: #000;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.8);
            transform: scale(1.05);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse-btn {
            0% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
            50% { box-shadow: 0 0 40px rgba(212, 175, 55, 0.6); text-shadow: 0 0 10px rgba(212,175,55,0.8); }
            100% { box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        }

        /* Typography */
        h1 { 
            color: #fceea7; font-size: 56px; margin: 0; font-weight: 400; 
            letter-spacing: 6px; 
            text-shadow: 0 0 50px rgba(252, 238, 167, 0.6); 
            background: linear-gradient(to bottom, #fff, #eebb66);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-family: 'Cinzel', 'Times New Roman', serif;
            opacity: 0.9;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Name Badge */
        .name-badge {
            margin-bottom: 15px; 
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #d4af37;
            padding: 10px 30px; 
            border-radius: 50px;
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
            backdrop-filter: blur(5px);
            animation: glow 3s infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); border-color: rgba(212, 175, 55, 0.3); transform: scale(1); }
            to { box-shadow: 0 0 50px rgba(255, 200, 100, 0.8); border-color: rgba(255, 200, 100, 1); transform: scale(1.05); }
        }

        .hint-text { 
            position: absolute; bottom: 5px; right: 10px;
            color: rgba(212, 175, 55, 0.3); font-size: 10px; 
            letter-spacing: 1px; text-transform: uppercase; pointer-events: none;
        }

        #webcam-wrapper {
            position: absolute; bottom: 30px; left: 30px; width: 280px; height: 210px;
            border: 1px solid rgba(212, 175, 55, 0.5); box-shadow: 0 0 20px rgba(0,0,0,0.9);
            border-radius: 4px; overflow: hidden; opacity: 1; pointer-events: none;
            z-index: 50; background: #000; transition: opacity 0.5s ease; 
        }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #debug-info {
            position: absolute; bottom: 5px; left: 5px; color: rgba(212, 175, 55, 0.8);
            font-size: 10px; font-family: monospace; background: rgba(0,0,0,0.5);
            padding: 2px 5px; pointer-events: none;
        }
    </style>
    <style> @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap'); </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Một món quà nhỏ dành cho cậu...</div>
        <button id="start-btn">Mở quà nhé 🎁</button>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <h1>🎂 Happy Birthday 🎂</h1>
        <div class="name-badge">✨ Ngô Thanh Giang ✨</div>
        <div class="hint-text">Interactive Hand Gestures Active. Double-click to change shape.</div>
    </div>

    <div id="webcam-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <div id="debug-info">Initializing...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'; 
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- CẤU HÌNH ---
        const isMobile = window.innerWidth < 768;
        const CONFIG = {
            colors: { bg: 0x000000, champagneGold: 0xffd966, deepGreen: 0x03180a, accentRed: 0x990000 },
            particles: { 
                count: isMobile ? 800 : 1500,
                dustCount: isMobile ? 1000 : 2500,
                snowCount: isMobile ? 150 : 400,
                treeHeight: 24, 
                treeRadius: 8.5     
            },
            camera: { z: 50 },
            preload: {
                images: [
                    './images/1.jpg', './images/2.jpg', './images/3.jpg', 
                    './images/4.jpg', './images/5.png', './images/6.jpeg',
                    './images/7.jpeg', './images/8.jpeg', './images/9.png',
                    // --- Thêm 10 ảnh mới (Bạn nhớ chép file vào folder images) ---
                    './images/10.jpeg', './images/11.jpeg', './images/12.jpeg',
                    './images/13.jpeg', './images/14.jpeg', './images/15.jpeg',
                    './images/16.jpeg', './images/17.jpeg', './images/18.jpeg',
                    './images/19.jpeg'
                ]
            }
        };

        const STATE = {
            mode: 'TULIP', focusIndex: -1, focusTarget: null,
            hand: { detected: false, x: 0, y: 0 }, rotation: { x: 0, y: 0 },
            isStarted: false
        };

        let scene, camera, renderer, composer, mainGroup, clock = new THREE.Clock();
        let particleSystem = [], photoMeshGroup = new THREE.Group();
        let handLandmarker, video, caneTexture;
        let snowSystem; 
        let firefliesSystem;
        
        let loadedPhotoCount = 0;

        const debugInfo = document.getElementById('debug-info');

        // --- ÂM THANH ---
        const MUSIC_URL = "./audio.mp3";
        let bgMusic = new Audio(MUSIC_URL);
        bgMusic.loop = true;
        bgMusic.volume = 1.0;

        async function init() {
            initThree(); setupEnvironment(); setupLights(); createTextures();
            createParticles(); createDust(); 
            createSnow(); createFireflies();
            loadPredefinedImages(); setupPostProcessing();
            setupEvents(); await initMediaPipe();
            
            const loader = document.getElementById('loader');
            const spinner = document.querySelector('.spinner');
            const loaderText = document.querySelector('.loader-text');
            const startBtn = document.getElementById('start-btn');

            spinner.style.display = 'none';
            loaderText.style.display = 'none';
            startBtn.style.display = 'block';

            startBtn.addEventListener('click', () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.log(err));
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }

                bgMusic.play().catch(e => console.log("Audio play error:", e));
                loader.style.opacity = 0;
                setTimeout(() => {
                    loader.remove();
                    STATE.isStarted = true;
                }, 1000);
            });

            animate();
        }

        function loadPredefinedImages() {
            const loader = new THREE.TextureLoader();
            CONFIG.preload.images.forEach((url, index) => {
                loader.load(url, 
                    (t) => { 
                        t.colorSpace = THREE.SRGBColorSpace; 
                        addPhotoToScene(t, index); 
                    },
                    undefined, (e) => console.log(`Skipped: ${url}`)
                );
            });
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.01);

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, CONFIG.camera.z);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping; renderer.toneMappingExposure = 2.2; 
            container.appendChild(renderer.domElement);

            mainGroup = new THREE.Group(); scene.add(mainGroup);
        }

        function setupEnvironment() {
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        }

        let innerLight;
        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.4); scene.add(ambient);

            // Breathing inner light (warm gold/amber)
            innerLight = new THREE.PointLight(0xffaa00, 3, 30);
            innerLight.position.set(0, 8, 0);
            mainGroup.add(innerLight);

            // Soft Violet spotlight
            const spotViolet = new THREE.SpotLight(0x9b5de5, 800);
            spotViolet.position.set(-30, 30, -30);
            spotViolet.angle = 0.6; spotViolet.penumbra = 0.8;
            scene.add(spotViolet);

            // Amber spotlight
            const spotAmber = new THREE.SpotLight(0xffb703, 1200);
            spotAmber.position.set(30, 40, 40);
            spotAmber.angle = 0.5; spotAmber.penumbra = 0.5;
            scene.add(spotAmber);

            const fill = new THREE.DirectionalLight(0xffeebb, 0.5); fill.position.set(0, 0, 50); scene.add(fill);
        }

        function setupPostProcessing() {
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.85; 
            bloomPass.strength = 0.3;   
            bloomPass.radius = 0.4;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
        }

        function createTextures() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,128,128);
            ctx.fillStyle = '#880000'; ctx.beginPath();
            for(let i=-128; i<256; i+=32) { ctx.moveTo(i, 0); ctx.lineTo(i+32, 128); ctx.lineTo(i+16, 128); ctx.lineTo(i-16, 0); }
            ctx.fill();
            caneTexture = new THREE.CanvasTexture(canvas);
            caneTexture.wrapS = THREE.RepeatWrapping; caneTexture.wrapT = THREE.RepeatWrapping; caneTexture.repeat.set(3, 3);
        }

        // --- TUYẾT RƠI ---
        function createSnow() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const velocities = [];

            const canvas = document.createElement('canvas'); canvas.width = 32; canvas.height = 32;
            const context = canvas.getContext('2d');
            context.fillStyle = 'white'; context.beginPath(); context.arc(16, 16, 16, 0, Math.PI * 2); context.fill();
            const snowTexture = new THREE.CanvasTexture(canvas);

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                const x = THREE.MathUtils.randFloatSpread(100);
                const y = THREE.MathUtils.randFloatSpread(60);
                const z = THREE.MathUtils.randFloatSpread(60);
                vertices.push(x, y, z);
                velocities.push(Math.random() * 0.2 + 0.1, Math.random() * 0.05);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('userData', new THREE.Float32BufferAttribute(velocities, 2));

            const material = new THREE.PointsMaterial({
                color: 0xffffff, size: 0.4, map: snowTexture,
                transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false
            });

            snowSystem = new THREE.Points(geometry, material);
            scene.add(snowSystem);
        }

        function updateSnow() {
            if (!snowSystem) return;
            const positions = snowSystem.geometry.attributes.position.array;
            const userData = snowSystem.geometry.attributes.userData.array;

            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                const fallSpeed = userData[i * 2];
                positions[i * 3 + 1] -= fallSpeed; 
                const swaySpeed = userData[i * 2 + 1];
                positions[i * 3] += Math.sin(clock.elapsedTime * 2 + i) * swaySpeed * 0.1; 

                if (positions[i * 3 + 1] < -30) {
                    positions[i * 3 + 1] = 30;
                    positions[i * 3] = THREE.MathUtils.randFloatSpread(100);
                    positions[i * 3 + 2] = THREE.MathUtils.randFloatSpread(60);
                }
            }
            snowSystem.geometry.attributes.position.needsUpdate = true;
        }

        // --- FIREFLIES ---
        function createFireflies() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const velocities = [];

            const canvas = document.createElement('canvas'); canvas.width = 16; canvas.height = 16;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(8, 8, 0, 8, 8, 8);
            gradient.addColorStop(0, 'rgba(255, 200, 100, 1)');
            gradient.addColorStop(0.2, 'rgba(255, 150, 50, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, 16, 16);
            const fireflyTexture = new THREE.CanvasTexture(canvas);

            for (let i = 0; i < 200; i++) {
                const x = THREE.MathUtils.randFloatSpread(80);
                const y = THREE.MathUtils.randFloatSpread(60);
                const z = THREE.MathUtils.randFloatSpread(80);
                vertices.push(x, y, z);
                velocities.push(Math.random() * 0.05 + 0.02, Math.random() * 0.02);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('userData', new THREE.Float32BufferAttribute(velocities, 2));

            const material = new THREE.PointsMaterial({
                color: 0xffdd88, size: 0.8, map: fireflyTexture,
                transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
            });

            firefliesSystem = new THREE.Points(geometry, material);
            scene.add(firefliesSystem);
        }

        function updateFireflies() {
            if (!firefliesSystem) return;
            const positions = firefliesSystem.geometry.attributes.position.array;
            const userData = firefliesSystem.geometry.attributes.userData.array;

            for (let i = 0; i < 200; i++) {
                const riseSpeed = userData[i * 2];
                positions[i * 3 + 1] += riseSpeed;
                const swaySpeed = userData[i * 2 + 1];
                positions[i * 3] += Math.sin(clock.elapsedTime * 1.5 + i) * swaySpeed;
                positions[i * 3 + 2] += Math.cos(clock.elapsedTime * 1.5 + i) * swaySpeed;

                if (positions[i * 3 + 1] > 40) {
                    positions[i * 3 + 1] = -30;
                    positions[i * 3] = THREE.MathUtils.randFloatSpread(80);
                    positions[i * 3 + 2] = THREE.MathUtils.randFloatSpread(80);
                }
            }
            firefliesSystem.geometry.attributes.position.needsUpdate = true;
        }

        class Particle {
            constructor(mesh, type, isDust = false) {
                this.mesh = mesh; this.type = type; this.isDust = isDust;
                this.posTree = new THREE.Vector3();
                this.posTulip = new THREE.Vector3();
                this.posScatter = new THREE.Vector3();
                this.baseScale = mesh.scale.x; 
                const speedMult = (type === 'PHOTO') ? 0.3 : 2.0;
                this.spinSpeed = new THREE.Vector3((Math.random()-0.5)*speedMult, (Math.random()-0.5)*speedMult, (Math.random()-0.5)*speedMult);
                this.calculatePositions();
            }
            calculatePositions() {
                if (this.type === 'PHOTO') {
                    this.posTree.set(0, 0, 0); 
                    this.posTulip.set(0, 0, 0);
                    const rScatter = 8 + Math.random()*12;
                    const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
                    return;
                }
                const h = CONFIG.particles.treeHeight; const halfH = h / 2;
                
                // --- Cây Thông ---
                let tTree = Math.random();
                tTree = Math.pow(tTree, 1.2);
                const yTree = (tTree * h) - halfH;
                let rMaxTree = CONFIG.particles.treeRadius * (1.0 - tTree); if (rMaxTree < 0.5) rMaxTree = 0.5;
                const angleTree = tTree * 50 * Math.PI + Math.random() * Math.PI; const rTree = rMaxTree * (0.8 + Math.random() * 0.4);
                this.posTree.set(Math.cos(angleTree) * rTree, yTree, Math.sin(angleTree) * rTree);

                // --- Hoa Tulip ---
                let isStem = Math.random() < 0.2;
                if (isStem) {
                    const yTulip = -halfH + Math.random() * (h * 0.5);
                    const rTulip = 0.4 + Math.random() * 0.4;
                    const angleTulip = Math.random() * Math.PI * 2;
                    this.posTulip.set(Math.cos(angleTulip) * rTulip, yTulip, Math.sin(angleTulip) * rTulip);
                } else {
                    const tFlower = Math.random();
                    const flowerYOffset = -halfH + (h * 0.5);
                    const flowerH = h * 0.5;
                    const yTulip = flowerYOffset + tFlower * flowerH;

                    // Tulip shape equation: narrower at bottom, wider in middle, slightly curved in at top
                    let rMaxTulip = Math.sin(tFlower * Math.PI) * (CONFIG.particles.treeRadius * 1.2);
                    if (tFlower > 0.6) {
                        // Curve slightly inwards near top, but leave an opening
                        rMaxTulip = rMaxTulip * (1.0 - (tFlower - 0.6) * 0.5);
                    }

                    const angleTulip = Math.random() * Math.PI * 2;
                    // Scalloped petal edges (3 petals)
                    const petalEffect = 1 + 0.15 * Math.sin(angleTulip * 3);
                    const rTulip = rMaxTulip * petalEffect * (0.95 + Math.random() * 0.1);

                    this.posTulip.set(Math.cos(angleTulip) * rTulip, yTulip, Math.sin(angleTulip) * rTulip);
                }

                // --- Scatter ---
                let rScatter = this.isDust ? (12 + Math.random()*20) : (8 + Math.random()*12);
                const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
            }
            update(dt, mode, focusTargetMesh) {
                let target = this.posTree;
                if (mode === 'TULIP') target = this.posTulip;
                else if (mode === 'SCATTER') target = this.posScatter;
                else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 38);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    } else target = this.posScatter;
                }
                const lerpSpeed = (mode === 'FOCUS' && this.mesh === focusTargetMesh) ? 5.0 : 2.0; 
                this.mesh.position.lerp(target, lerpSpeed * dt);

                if (mode === 'SCATTER') {
                    this.mesh.rotation.x += this.spinSpeed.x * dt; this.mesh.rotation.y += this.spinSpeed.y * dt; this.mesh.rotation.z += this.spinSpeed.z * dt; 
                } else if (mode === 'TREE' || mode === 'TULIP') {
                    if (this.type === 'PHOTO') { this.mesh.lookAt(0, this.mesh.position.y, 0); this.mesh.rotateY(Math.PI); }
                    else { this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, 0, dt); this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, dt); this.mesh.rotation.y += 0.5 * dt; }
                }
                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) this.mesh.lookAt(camera.position); 

                let s = this.baseScale;
                if (this.isDust) { s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id)); if (mode === 'TREE' || mode === 'TULIP') s = 0; }
                else if (mode === 'SCATTER' && this.type === 'PHOTO') s = this.baseScale * 2.5; 
                else if (mode === 'FOCUS') { 
                    if (this.mesh === focusTargetMesh) s = 3.5;
                    else s = this.baseScale * 0.8; 
                }
                this.mesh.scale.lerp(new THREE.Vector3(s,s,s), 4*dt);
            }
        }

        function updatePhotoLayout() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO');
            const count = photos.length; if (count === 0) return;
            const h = CONFIG.particles.treeHeight * 0.9; const bottomY = -h/2; const stepY = h / count; const loops = 3;
            photos.forEach((p, i) => {
                const y = bottomY + stepY * i + stepY/2;
                const fullH = CONFIG.particles.treeHeight; const normalizedH = (y + fullH/2) / fullH; 

                // For Tree Mode
                let rMaxTree = CONFIG.particles.treeRadius * (1.0 - normalizedH); if (rMaxTree < 1.0) rMaxTree = 1.0;
                const rTree = rMaxTree + 3.0; const angleTree = normalizedH * Math.PI * 2 * loops + (Math.PI/4);
                p.posTree.set(Math.cos(angleTree) * rTree, y, Math.sin(angleTree) * rTree);

                // For Tulip Mode (place photos around the tulip base/stem)
                const rTulip = 4.0;
                const angleTulip = (i / count) * Math.PI * 2;
                p.posTulip.set(Math.cos(angleTulip) * rTulip, -fullH/2 + 2, Math.sin(angleTulip) * rTulip);
            });
        }

        function createParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32); 
            const boxGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55); 
            const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 0.3, 0), new THREE.Vector3(0.1, 0.5, 0), new THREE.Vector3(0.3, 0.4, 0)]);
            const candyGeo = new THREE.TubeGeometry(curve, 16, 0.08, 8, false);

            const goldMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.champagneGold, metalness: 1.0, roughness: 0.1, envMapIntensity: 2.0, emissive: 0x443300, emissiveIntensity: 0.3 });
            const greenMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.deepGreen, metalness: 0.2, roughness: 0.8, emissive: 0x002200, emissiveIntensity: 0.2 });
            const redMat = new THREE.MeshPhysicalMaterial({ color: CONFIG.colors.accentRed, metalness: 0.3, roughness: 0.2, clearcoat: 1.0, emissive: 0x330000 });
            const candyMat = new THREE.MeshStandardMaterial({ map: caneTexture, roughness: 0.4 });

            for (let i = 0; i < CONFIG.particles.count; i++) {
                const rand = Math.random(); let mesh, type;
                if (rand < 0.40) { mesh = new THREE.Mesh(boxGeo, greenMat); type = 'BOX'; }
                else if (rand < 0.70) { mesh = new THREE.Mesh(boxGeo, goldMat); type = 'GOLD_BOX'; }
                else if (rand < 0.92) { mesh = new THREE.Mesh(sphereGeo, goldMat); type = 'GOLD_SPHERE'; }
                else if (rand < 0.97) { mesh = new THREE.Mesh(sphereGeo, redMat); type = 'RED'; }
                else { mesh = new THREE.Mesh(candyGeo, candyMat); type = 'CANE'; }
                const s = 0.4 + Math.random() * 0.5; mesh.scale.set(s,s,s); mesh.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
                mainGroup.add(mesh); particleSystem.push(new Particle(mesh, type, false));
            }

            const starShape = new THREE.Shape(); const points = 5; const outerRadius = 1.5; const innerRadius = 0.7; 
            for (let i = 0; i < points * 2; i++) {
                const angle = (i * Math.PI) / points + Math.PI / 2; const r = (i % 2 === 0) ? outerRadius : innerRadius;
                const x = Math.cos(angle) * r; const y = Math.sin(angle) * r;
                if (i === 0) starShape.moveTo(x, y); else starShape.lineTo(x, y);
            }
            starShape.closePath();
            const starGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.4, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 2 }); starGeo.center(); 
            const starMat = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: 0xffaa00, emissiveIntensity: 1.0, metalness: 1.0, roughness: 0 });
            const star = new THREE.Mesh(starGeo, starMat); star.position.set(0, CONFIG.particles.treeHeight/2 + 1.2, 0);
            mainGroup.add(star); mainGroup.add(photoMeshGroup);
        }

        function createDust() {
            const geo = new THREE.TetrahedronGeometry(0.08, 0);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.8 });
            for(let i=0; i<CONFIG.particles.dustCount; i++) {
                 const mesh = new THREE.Mesh(geo, mat); mesh.scale.setScalar(0.5 + Math.random());
                 mainGroup.add(mesh); particleSystem.push(new Particle(mesh, 'DUST', true));
            }
        }

        // --- HÀM ADD PHOTO ĐÃ CHỈNH SỬA KÍCH THƯỚC BÉ XÍU CHO ẢNH PHỤ ---
        function addPhotoToScene(texture, specificIndex) {
            loadedPhotoCount++;
            const currentIndex = (specificIndex !== undefined) ? specificIndex : (loadedPhotoCount - 1);

            const frameGeo = new THREE.BoxGeometry(1.4, 1.4, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.champagneGold, metalness: 1.0, roughness: 0.1 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            
            let width = 1.2; let height = 1.2;
            if (texture.image) {
                const aspect = texture.image.width / texture.image.height;
                if (aspect > 1) height = width / aspect; else width = height * aspect;
            }
            const photoGeo = new THREE.PlaneGeometry(width, height);

            let photoMat;
            let currentScale = 0.6; // Mặc định vừa phải (cho ảnh 1-4)

            if (currentIndex < 4) {
                 // Ảnh 1-4: Màu tối (Style Index), kích thước 0.6
                 photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, color: 0xcccccc });
            } else {
                 // Ảnh 5+: Màu sáng (Style Pro), kích thước BÉ (0.2)
                 photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                 currentScale = 0.2; 
            }

            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = 0.04;
            const group = new THREE.Group(); group.add(frame); group.add(photo);
            frame.scale.set(width/1.2, height/1.2, 1);
            
            group.scale.set(currentScale, currentScale, currentScale);
            
            photoMeshGroup.add(group); particleSystem.push(new Particle(group, 'PHOTO', false));
            updatePhotoLayout();
        }

        async function initMediaPipe() {
            video = document.getElementById('webcam');
            const constraints = { video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } } };
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`, delegate: "GPU" },
                runningMode: "VIDEO", numHands: 1
            });
            if (navigator.mediaDevices?.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream; video.addEventListener("loadeddata", predictWebcam);
                    debugInfo.innerText = "Webcam active. Show hand.";
                } catch(e) {
                    console.warn("Webcam access denied", e); debugInfo.innerText = "Camera error: " + e.message;
                    document.getElementById('webcam-wrapper').style.display = 'none';
                }
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) { const result = handLandmarker.detectForVideo(video, performance.now()); processGestures(result); }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(result) {
            if (result.landmarks && result.landmarks.length > 0) {
                STATE.hand.detected = true;
                const lm = result.landmarks[0];
                STATE.hand.x = (lm[9].x - 0.5) * 2; STATE.hand.y = (lm[9].y - 0.5) * 2;
                const thumb = lm[4]; const index = lm[8]; const wrist = lm[0]; const middleMCP = lm[9]; 
                const handSize = Math.hypot(middleMCP.x - wrist.x, middleMCP.y - wrist.y);
                if (handSize < 0.02) return;
                const tips = [lm[8], lm[12], lm[16], lm[20]]; let avgTipDist = 0;
                tips.forEach(t => avgTipDist += Math.hypot(t.x - wrist.x, t.y - wrist.y)); avgTipDist /= 4;
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                const extensionRatio = avgTipDist / handSize; const pinchRatio = pinchDist / handSize;
                debugInfo.innerText = `Size: ${handSize.toFixed(2)} | Ext: ${extensionRatio.toFixed(2)} | Pinch: ${pinchRatio.toFixed(2)} | Mode: ${STATE.mode}`;
                if (extensionRatio < 1.5) { STATE.mode = 'TREE'; STATE.focusTarget = null; } 
                else if (pinchRatio < 0.35) {
                    if (STATE.mode !== 'FOCUS') {
                        STATE.mode = 'FOCUS'; const photos = particleSystem.filter(p => p.type === 'PHOTO');
                        if (photos.length) STATE.focusTarget = photos[Math.floor(Math.random()*photos.length)].mesh;
                    }
                } else if (extensionRatio > 1.7) { STATE.mode = 'SCATTER'; STATE.focusTarget = null; }
            } else { STATE.hand.detected = false; debugInfo.innerText = "No hand detected"; }
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight); composer.setSize(window.innerWidth, window.innerHeight);
            });
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'h') {
                    const webcam = document.getElementById('webcam-wrapper'); 
                    if(webcam) webcam.classList.toggle('ui-hidden');
                }
            });

            // Allow double click or double tap to toggle between shapes
            window.addEventListener('dblclick', () => {
                if (STATE.mode === 'TULIP') STATE.mode = 'TREE';
                else if (STATE.mode === 'TREE') STATE.mode = 'TULIP';
            });
        }

        function animate() {
            requestAnimationFrame(animate); const dt = clock.getDelta();

            // Breathing light effect
            if (innerLight) {
                innerLight.intensity = 3 + Math.sin(clock.elapsedTime * 2) * 1.5;
            }
            if (STATE.mode === 'SCATTER' && STATE.hand.detected) {
                const targetRotY = STATE.hand.x * Math.PI * 0.9; const targetRotX = STATE.hand.y * Math.PI * 0.25;
                STATE.rotation.y += (targetRotY - STATE.rotation.y) * 3.0 * dt; STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.0 * dt;
            } else {
                if(STATE.mode === 'TREE' || STATE.mode === 'TULIP') { STATE.rotation.y += 0.3 * dt; STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt; }
                else { STATE.rotation.y += 0.1 * dt; }
            }
            mainGroup.rotation.y = STATE.rotation.y; mainGroup.rotation.x = STATE.rotation.x;
            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget)); 
            
            updateSnow(); 
            updateFireflies();

            composer.render();
        }
        init();
    </script>
